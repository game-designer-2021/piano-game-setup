function saveRC(){var v=document.getElementById('rc-in').value.trim();if(!v){toast('أدخل كود الغرفة','var(--red)');return}RC=v;localStorage.setItem('pt_rc',RC);RN=gun.get('pt-room-'+RC);GL=false;toast('تم حفظ: '+RC,'var(--green)');loadGM();listenG();gn(523)}
function loadG(){try{MM.g=JSON.parse(localStorage.getItem('pt_g'))||{}}catch(e){MM.g={}}}

function addG(){var n=document.getElementById('gn-in').value.trim();var c=document.getElementById('gc-in').value.trim();if(!n||!c){toast('أدخل الاسم والكود','var(--red)');return}loadG();MM.g[c]={name:n,ts:Date.now()};saveG();renderG();document.getElementById('gn-in').value='';document.getElementById('gc-in').value='';if(RN)RN.get('guests').get(c).put({name:n,ts:Date.now()});toast('تم إضافة '+n,'var(--green)');gn(523)}
function remG(c){loadG();delete MM.g[c];saveG();renderG();if(RN)RN.get('guests').get(c).put(null)}
function renderG(){loadG();var el=document.getElementById('glist');var ks=Object.keys(MM.g);if(!ks.length){el.innerHTML='<div style="font-size:10px;color:var(--muted)">لا يوجد ضيوف</div>';return}el.innerHTML=ks.map(function(k){return'<div class="gr"><span>'+esc(MM.g[k].name)+' <span style="color:var(--cyan);font-family:monospace;font-size:10px">('+esc(k)+')</span></span><button onclick="remG(\''+k+'\')"><i class="fas fa-times"></i></button></div>'}).join('')}
function openGC(){document.getElementById('gc-modal').classList.add('on');document.getElementById('gc-room').value='';document.getElementById('gc-code').value='';document.getElementById('gc-st').innerHTML='';document.getElementById('gc-go').disabled=false;setTimeout(function(){document.getElementById('gc-room').focus()},300)}
function closeGC(){document.getElementById('gc-modal').classList.remove('on')}
function doGC(){var r=document.getElementById('gc-room').value.trim();var c=document.getElementById('gc-code').value.trim();var st=document.getElementById('gc-st');var btn=document.getElementById('gc-go');if(!r||!c){st.innerHTML='<span style="color:var(--red)">أدخل الكودين</span>';return}btn.disabled=true;st.innerHTML='<span style="color:var(--gold)"><i class="fas fa-spinner fa-spin"></i> جاري الاتصال...</span>';RC=r;RN=gun.get('pt-room-'+r);var done=false;RN.get('guests').get(c).once(function(d){if(done)return;done=true;var nm=(d&&d.name)?d.name:c;MM.mode='guest';MM.nm=nm;closeGC();document.getElementById('gameover').classList.remove('on');openMsg();sNS('on','متصل');toast('مرحباً '+nm,'var(--green)');gn(523);loadGM();listenG()});setTimeout(function(){if(done)return;done=true;MM.mode='guest';MM.nm=c;closeGC();document.getElementById('gameover').classList.remove('on');openMsg();sNS('on','متصل');toast('مرحباً','var(--green)');gn(523);loadGM();listenG()},6000)}
function initGun(){if(!RC){toast('حدد كود الغرفة أولاً','var(--red)');return}RN=gun.get('pt-room-'+RC);GL=false;sNS('on','جاهز');toast('تم الاتصال','var(--green)');loadG();Object.keys(MM.g).forEach(function(c){RN.get('guests').get(c).put({name:MM.g[c].name,ts:MM.g[c].ts||Date.now()})});loadGM();listenG()}
function loadGM(){if(!RN)return;RN.get('msgs').map().once(function(d){if(!d||!d.id||d.text===null||d.text===undefined)return;var tx=d.text;if(d.enc){var dd=dec(d.text,AK);if(dd)tx=dd}if(!MM.msgs.find(function(m){return m.id===d.id})){MM.msgs.push({id:d.id,who:d.who||'?',text:tx,ts:d.ts||0,admin:!!d.admin,system:!!d.system})}});setTimeout(function(){MM.msgs.sort(function(a,b){return a.ts-b.ts});svM();if(document.getElementById('msg-ov').classList.contains('on'))renderM()},1500)}
function listenG(){if(!RN||GL)return;GL=true;RN.get('msgs').map().on(function(d){if(!d||d.id===undefined)return;if(d.text===null||d.text===undefined){var i=MM.msgs.findIndex(function(m){return m.id===d.id});if(i>-1){MM.msgs.splice(i,1);svM();if(document.getElementById('msg-ov').classList.contains('on'))renderM()}return}var tx=d.text;if(d.enc){var dd=dec(d.text,AK);if(dd)tx=dd}if(!MM.msgs.find(function(m){return m.id===d.id})){MM.msgs.push({id:d.id,who:d.who||'?',text:tx,ts:d.ts||0,admin:!!d.admin,system:!!d.system});MM.msgs.sort(function(a,b){return a.ts-b.ts});svM();if(document.getElementById('msg-ov').classList.contains('on'))renderM();gn(392)}})}
function delM(id){MM.msgs=MM.msgs.filter(function(m){return m.id!==id});svM();renderM();if(RN)RN.get('msgs').get(id).put(null)}
function confirmClr(){showCf('مسح كل الرسائل؟',function(){if(RN){MM.msgs.forEach(function(m){RN.get('msgs').get(m.id).put(null)})}MM.msgs=[];MM.st.forEach(function(t){clearInterval(t)});MM.st=[];svM();renderM();toast('تم المسح','var(--red)')})}
function openMsg(){document.getElementById('msg-ov').classList.add('on');sCt=MS;var p=document.getElementById('mpill');if(MM.mode==='admin'){p.textContent='أدمن';p.className='mpill mp-a';document.getElementById('apanel').style.display='block';loadRC();renderG()}else{p.textContent='ضيف';p.className='mpill mp-g';document.getElementById('apanel').style.display='none'}ldM();renderM();if(MM.mode==='admin'&&RC&&!RN)initGun();if(MM.mode==='admin'&&!RC)sNS('err','حدد كود الغرفة')}
function closeMsg(){document.getElementById('msg-ov').classList.remove('on');if(MM.mode==='guest'){MM.st.forEach(function(t){clearInterval(t)});MM.st=[];MM.msgs.forEach(function(m){MM.vw.add(m.id)});localStorage.setItem('pt_v',JSON.stringify(Array.from(MM.vw)))}MM.mode=null;document.getElementById('gameover').classList.add('on')}
function ldM(){try{MM.msgs=JSON.parse(localStorage.getItem('pt_m_'+RC))||[]}catch(e){MM.msgs=[]}try{MM.vw=new Set(JSON.parse(localStorage.getItem('pt_v')))}catch(e){MM.vw=new Set()}}
function svM(){localStorage.setItem('pt_m_'+RC,JSON.stringify(MM.msgs))}
function sendM(){var inp=document.getElementById('minp');var t=inp.value.trim();if(!t)return;var msg={id:Date.now().toString(36)+Math.random().toString(36).substr(2,4),who:MM.nm,text:t,ts:Date.now(),admin:MM.mode==='admin'};MM.msgs.push(msg);svM();inp.value='';inp.style.height='auto';renderM();gn(MEL[mI%MEL.length]);mI++;if(RN){RN.get('msgs').get(msg.id).put({id:msg.id,who:msg.who,text:enc(t,AK),ts:msg.ts,admin:msg.admin,enc:true})}}
function renderM(){var list=document.getElementById('ml');var all=MM.msgs.filter(function(m){if(m.system)return true;if(MM.mode==='guest'&&!MM.vw.has(m.id))return true;if(MM.mode==='admin')return true;return false}).sort(function(a,b){return a.ts-b.ts});if(!all.length){list.innerHTML='<div class="emp">فارغ</div>';return}var tot=all.length;var hm=tot>sCt;var vis=hm?all.slice(tot-sCt):all;var hid=tot-sCt;var h='';if(hm)h+='<button class="sb" style="align-self:center;margin-bottom:4px" onclick="sCt+=100;renderM()"><i class="fas fa-chevron-up"></i> عرض '+hid+' أقدم</button>';var isA=MM.mode==='admin';for(var i=0;i<vis.length;i++){var m=vis[i];if(m.system){h+='<div class="mc sys">'+esc(m.text)+'</div>';continue}var mine=m.who===MM.nm;var sc=mine?'mn':'th';var tag=m.admin?'<span style="color:var(--gold);font-size:7px">★</span>':'';var time=new Date(m.ts).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});var ig=MM.mode==='guest';var sb=ig?'<div class="sbar"><div class="sfill" id="sf-'+m.id+'" style="width:100%"></div></div>':'';var burned=MM.mode==='guest'&&MM.vw.has(m.id);var del=isA?'<button class="mdel" onclick="event.stopPropagation();delM(\''+m.id+'\')"><i class="fas fa-times"></i></button>':'';h+='<div class="mc '+sc+' '+(burned?'burned':'')+'" id="mc-'+m.id+'">'+del+'<div class="sn">'+tag+' '+esc(m.who)+'</div><div class="bd">'+esc(m.text)+'</div><div class="mt">'+time+'</div>'+sb+'</div>'}list.innerHTML=h;requestAnimationFrame(function(){list.scrollTop=list.scrollHeight});MM.st.forEach(function(t){clearInterval(t)});MM.st=[];if(MM.mode==='guest'){vis.filter(function(m){return!m.system&&!MM.vw.has(m.id)}).forEach(function(m){snap(m.id)})}}
function snap(id){var el=document.getElementById('sf-'+id);if(!el)return;var rem=100;var dur=SD;var step=80;var timer=setInterval(function(){rem-=(step/dur)*100;if(rem<=0){clearInterval(timer);var c=document.getElementById('mc-'+id);if(c)c.classList.add('burned');MM.vw.add(id);localStorage.setItem('pt_v',JSON.stringify(Array.from(MM.vw)))}else{el.style.width=rem+'%'}},step);MM.st.push(timer)}
var bEl=document.getElementById('board');
function startGame(){document.getElementById('start').classList.add('off');document.getElementById('game').style.display='flex';document.getElementById('gameover').classList.remove('on');G.s=0;G.l=G.ML;G.c=0;G.sp=G.bs;G.run=true;G.rows=[];bEl.querySelectorAll('.row').forEach(function(r){r.remove()});updH();var bH=bEl.offsetHeight;var cnt=Math.ceil(bH/RH)+2;for(var i=0;i<cnt;i++)spR(-RH*(cnt-i-1));G.lt=performance.now();if(G.raf)cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(loop);mI=0}
function spR(y){var bc=Math.floor(Math.random()*4);var row={id:G.nid++,y:y,blackCol:bc,tapped:false,missed:false,el:null};var el=document.createElement('div');el.className='row';el.style.height=RH+'px';el.style.top=row.y+'px';for(var c=0;c<4;c++){var cell=document.createElement('div');cell.className='cell'+(c===bc?' black':'');cell.dataset.col=c;cell.dataset.rid=row.id;el.appendChild(cell)}bEl.appendChild(el);row.el=el;G.rows.push(row)}
function loop(t){if(!G.run)return;var dt=Math.min(t-G.lt,50);G.lt=t;var bH=bEl.offsetHeight;var mv=G.sp*dt*.12;for(var i=0;i<G.rows.length;i++){var r=G.rows[i];r.y+=mv;r.el.style.top=r.y+'px';if(!r.tapped&&!r.missed&&r.y>bH+8){r.missed=true;G.l--;G.c=0;errSnd();sFl('rgba(255,45,85,.1)');var c=r.el.children[r.blackCol];if(c)c.classList.add('flash-miss');updH();if(G.l<=0){gO();return}}}G.rows=G.rows.filter(function(r){if(r.y>bH+RH+40){r.el.remove();return false}return true});var top=G.rows.reduce(function(m,r){return r.y<m.y?r:m},{y:Infinity});if(top.y>0)spR(top.y-RH);G.sp=G.bs+G.s*.028;document.getElementById('spf').style.width=Math.max(4,Math.min(100,((G.sp-G.bs)/7)*100))+'%';G.raf=requestAnimationFrame(loop)}
bEl.addEventListener('pointerdown',function(e){if(!G.run)return;var cell=e.target.closest('.cell.black');if(!cell){var wc=e.target.closest('.cell:not(.black)');if(wc){var rEl=wc.closest('.row');if(!rEl)return;var rid=parseInt(wc.dataset.rid);var rw=G.rows.find(function(r){return r.id===rid});if(!rw||rw.tapped)return;G.l--;G.c=0;errSnd();sFl('rgba(255,45,85,.12)');wc.classList.add('flash-miss');setTimeout(function(){wc.classList.remove('flash-miss')},180);updH();if(G.l<=0)gO()}return}var rid=parseInt(cell.dataset.rid);var rw=G.rows.find(function(r){return r.id===rid});if(!rw||rw.tapped)return;var cc=parseInt(cell.dataset.col);if(cc!==rw.blackCol)return;rw.tapped=true;cell.classList.add('tapped','flash-hit');setTimeout(function(){cell.classList.remove('flash-hit')},80);G.s++;G.c++;gn(MEL[mI%MEL.length]);mI++;var rc=cell.getBoundingClientRect();fPt(rc.left+rc.width/2,rc.top,'+1',G.c>3?'var(--gold)':'var(--cyan)');if(G.c>2&&G.c%5===0)sC(G.c);updH()});
function updH(){document.getElementById('sc').textContent=G.s;var h='';for(var i=0;i<G.ML;i++)h+='<i class="fas fa-heart '+(i>=G.l?'lost':'')+'" style="color:'+(i>=G.l?'var(--muted)':'var(--red)')+'"></i>';document.getElementById('lv').innerHTML=h}
function fPt(x,y,t,c){var e=document.createElement('div');e.className='float-score';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';e.style.color=c;document.body.appendChild(e);setTimeout(function(){e.remove()},650)}
function sC(n){var e=document.createElement('div');e.className='combo-pop';e.textContent='x'+n;e.style.color='var(--gold)';document.body.appendChild(e);setTimeout(function(){e.remove()},450)}
function sFl(c){var e=document.createElement('div');e.className='screen-flash';e.style.background=c;document.body.appendChild(e);setTimeout(function(){e.remove()},250)}
function gO(){G.run=false;if(G.raf)cancelAnimationFrame(G.raf);if(G.s>G.best){G.best=G.s;localStorage.setItem('pt_b',G.best)}document.getElementById('gos').textContent=G.s;document.getElementById('gob').textContent='أفضل: '+G.best;document.getElementById('gon').value='';rLB();document.getElementById('gameover').classList.add('on');setTimeout(function(){document.getElementById('gon').focus()},350)}
function retry(){document.getElementById('gameover').classList.remove('on');startGame()}
function gLB(){try{return JSON.parse(localStorage.getItem('pt_lb'))||[]}catch(e){return[]}}
function sLB(l){localStorage.setItem('pt_lb',JSON.stringify(l))}
function rLB(){var lb=gLB();var el=document.getElementById('lb');if(!lb.length){el.innerHTML='';return}el.innerHTML=lb.sort(function(a,b){return b.s-a.s}).slice(0,8).map(function(e,i){return'<div class="lb-row"><span class="1n">'+(i+1)+'. '+esc(e.n)+'</span><span class="s">'+e.s+'</span></div>'}).join('')}
function submitName(){var v=document.getElementById('gon').value.trim();if(!v)return;if(v===AK){MM.mode='admin';MM.nm='أدمن';document.getElementById('gameover').classList.remove('on');openMsg();return}var lb=gLB();lb.push({n:v,s:G.s});sLB(lb);rLB();document.getElementById('gon').value='';document.getElementById('gob').textContent='تم الحفظ! أفضل: '+G.best}
(function(){var b=localStorage.getItem('pt_b');if(b)G.best=parseInt(b)||0})();
